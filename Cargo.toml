[workspace]
resolver = "2"
members = ["crates/common"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "allow"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
