[package]
name = "club-bus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = "0.4.45"
club-common = { version = "0.1.0", path = "../common" }
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"] }
sea-orm = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres", "with-uuid", "with-chrono", "with-json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
